<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .logo {
            display: block;
            margin: 0 auto;
            width: 35%;
        }
        .backup-link {
            text-align: center;
            font-size: 0.95rem;
            margin-top: 15px;
        }
        .backup-link a {
            color: #102598;
            text-decoration: none;
            font-weight: bold;
        }
        .backup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./CartoMicro.png" alt="Logo de la Empresa" class="logo">

        <h2 id="contact-name"></h2>

        <a href="#" id="download-link" class="download-button" style="display: none;">Descargar Contacto (vCard)</a>

        <!-- 🔹 Formulario profesional (cuenta Cartomicro) -->
        <div class="form-container">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScfqx6KsWKZK2Jru3BwgyDWVZiU1bmNhbY9mHo4CNmuYejzCg/viewform?embedded=true"
                    width="100%" height="1251" frameborder="0" marginheight="0" marginwidth="0">
                Cargando…
            </iframe>
        </div>

        <!-- 🔹 Enlace de respaldo -->
        <p class="backup-link">
            📋 Si no ves el formulario, 
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScfqx6KsWKZK2Jru3BwgyDWVZiU1bmNhbY9mHo4CNmuYejzCg/viewform" target="_blank">
                haz clic aquí para abrirlo directamente
            </a>.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const users = {
                jsosa: {
                    name: "Ing. Jesús Manuel Sosa Vázquez",
                    vcf: "./jsosa.vcf"
                },
                jrodriguez: {
                    name: "Lic. Javier Rodríguez Bravo",
                    vcf: "./jrodriguez.vcf"
                },
                lgonzalez: {
                    name: "Ing. Luis Gerardo González Padilla",
                    vcf: "./lgonzalez.vcf"
                },
                lvillanueva: {
                    name: "Ing. Luis Felipe Villanueva González",
                    vcf: "./lvillanueva.vcf"
                },
                mlara: {
                    name: "Lic. Milton Saúl Lara Gutiérrez",
                    vcf: "./mlara.vcf"
                },
                iperez: {
                    name: "Ileana Andrea Pérez Montes",
                    vcf: "./iperez.vcf"
                },
                jgamino: {
                    name: "Jonathan Jassiel Ramírez Gamiño",
                    vcf: "./jgamino.vcf"
                },
                fpeza: {
                    name: "Fernando Peza Ramos",
                    vcf: "./fpeza.vcf"
                },
                avargas: {
                    name: "Juan Antonio Vargas Montes",
                    vcf: "./avargas.vcf"
                },
                jvelazquez: {
                    name: "Ing. Jorge Velázquez Bonilla",
                    vcf: "./jvelazquez.vcf"
                },
                lrivas: {
                    name: "Ing. Luis Rodolfo Barrera Rivas",
                    vcf: "./lrivas.vcf"
                },
                emalagon: {
                    name: "María Eugenia Malagón Zamudio",
                    vcf: "./emalagon.vcf"
                }
            };

            const params = new URLSearchParams(window.location.search);
            const userKey = params.get('user');

            const contactNameElement = document.getElementById('contact-name');
            const downloadLinkElement = document.getElementById('download-link');

            if (userKey && users[userKey]) {
                const userData = users[userKey];
                document.title = `Contacto - ${userData.name}`;
                contactNameElement.textContent = userData.name;
                downloadLinkElement.href = userData.vcf;
                downloadLinkElement.style.display = 'inline-block';
            } else {
                document.title = "Contacto no encontrado";
                contactNameElement.textContent = "Por favor, escanee un código QR válido.";
            }
        });
    </script>
</body>
</html>
